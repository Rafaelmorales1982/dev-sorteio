<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <section class="container-title">
      <img id="imagem" class="title-img" src="./img/titulo-sorteio.png" alt="Imagem Sorteio" />
    </section>

      <h2>Sortear um número</h2>
      <div class="campos-inputs">
        <input class="input-min" type="number" placeholder="entre" />
        <input class="input-max" type="number" placeholder="e" />
      </div>

      <button class="randomizar-btn">Sortear</button>

      <p class="result-number">Número Sorteado:<span class="resultado"></span> </p>
   
    <script src="./script.js"></script>
  </body>
</html>
